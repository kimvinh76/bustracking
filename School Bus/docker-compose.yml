# --- File: School Bus/docker-compose.yml ---
version: '3.8'

services:
  # 1. Backend (NodeJS)
  server-backend:
    build: ./backend      # Chỉ vào thư mục backend để tìm Dockerfile
    container_name: school-bus-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"       # Cổng 5000
    environment:
      - DB_HOST=db-mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - BACKEND_PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=http://localhost:${FRONTEND_PORT:-5173}
      - ENABLE_BUS_LOCATION_HISTORY=${ENABLE_BUS_LOCATION_HISTORY}
      - BUS_LOCATION_HISTORY_INTERVAL_MS=${BUS_LOCATION_HISTORY_INTERVAL_MS}
    depends_on:
      db-mysql:
        condition: service_healthy
    restart: unless-stopped

  # 2. Frontend (React - code trong src)
  client-frontend:
    build: ./frontend         # Đổi từ . sang ./frontend
    container_name: school-bus-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"       # Cổng 5173
    environment:
      - VITE_API_BASE_URL=http://localhost:${BACKEND_PORT:-5000}/api
      - VITE_SOCKET_URL=http://localhost:${BACKEND_PORT:-5000}
    volumes:
      - ./frontend/src:/app/src    # Hot reload: sửa code trong src thì web tự cập nhật
      - /app/node_modules # Bảo vệ node_modules không bị ghi đè
    depends_on:
      - server-backend
    restart: unless-stopped

  # 3. Database
  db-mysql:
    image: mysql:8.0
    container_name: school-bus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306" # Mở port để dùng DBeaver
    volumes:
      # File SQL để khởi tạo database (có sẵn trong thư mục database/)
      - ./database/school_bus_db.sql:/docker-entrypoint-initdb.d/init.sql
      # Lưu dữ liệu MySQL persistent (không mất khi restart container)
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# Định nghĩa volumes để lưu dữ liệu MySQL
volumes:
  mysql_data: